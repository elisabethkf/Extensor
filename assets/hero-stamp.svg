<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Norsk helse-IT siden 2004">
  <defs>
    <style>
      @font-face {
        font-family: 'Manrope';
        font-weight: 800;
        src: url(data:font/woff2;base64,) format('woff2');
      }
      .stamp-text {
        font-family: 'Manrope', 'Avenir Next', 'Helvetica Neue', Arial, sans-serif;
        font-weight: 800;
        font-size: 16.5px;
        letter-spacing: 2.6px;
        fill: #24454B;
      }
    </style>
    <path id="arc-topp" d="M 33,100 A 67,67 0 0 1 167,100" fill="none"/>
    <path id="arc-bunn" d="M 29.5,100 A 70.5,70.5 0 0 0 170.5,100" fill="none"/>
  </defs>

  <!-- Bunnsirkel med kant -->
  <circle cx="100" cy="100" r="96.5" fill="#f0d84a" stroke="#d9bd2f" stroke-width="3"/>
  <!-- Stiplet ring (stempel-følelse) -->
  <circle cx="100" cy="100" r="86" fill="none" stroke="#24454B" stroke-width="1.7" stroke-dasharray="0.5 5.2" stroke-linecap="round"/>

  <!-- Tekst langs buer -->
  <text class="stamp-text"><textPath href="#arc-topp" startOffset="50%" text-anchor="middle">NORSK HELSE-IT</textPath></text>
  <text class="stamp-text"><textPath href="#arc-bunn" startOffset="50%" text-anchor="middle">SIDEN 2004</textPath></text>

  <!-- Skilletegn (diamanter) ved 3 og 9 -->
  <rect x="-3" y="-3" width="6" height="6" fill="#24454B" transform="translate(26,100) rotate(45)"/>
  <rect x="-3" y="-3" width="6" height="6" fill="#24454B" transform="translate(174,100) rotate(45)"/>

  <!-- Hexagon-merke i midten (nikk til Extensor-logoen) -->
  <path d="M100.00,70.00 L74.02,85.00 L74.02,115.00 L100.00,130.00 L125.98,115.00 L125.98,85.00 Z" fill="none" stroke="#24454B" stroke-width="4.5" stroke-linejoin="round"/>
  <path d="M100.00,80.50 L83.11,90.25 L83.11,109.75 L100.00,119.50 L116.89,109.75 L116.89,90.25 Z" fill="none" stroke="#24454B" stroke-width="2.4" stroke-linejoin="round" opacity="0.85"/>
</svg>
